workflows:
  android-apk:
    name: Android APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Point Gradle at the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build APK
        script: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/**/*.apk
